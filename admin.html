<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>管理</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <section class="view view-feed">
    <header class="site-header">
      <div class="header-inner">
        <a class="back-btn" href="index.html">‹ 返回首页</a>
        <h1 class="site-title">动态管理</h1>
        <p class="site-sub">in平度 · 发布与维护</p>
      </div>
    </header>

    <main class="container">
      <div class="feed-wrap">

        <!-- 登录框（未登录显示） -->
        <div id="loginBox" class="composer admin-login">
          <h2 class="admin-h">管理员登录</h2>
          <input type="email" id="loginEmail" placeholder="邮箱" autocomplete="username" />
          <input type="password" id="loginPwd" placeholder="密码" autocomplete="current-password" />
          <p id="loginError" class="pwd-error hidden">邮箱或密码错误，请重试</p>
          <div class="pwd-actions">
            <button id="loginBtn" class="admin-login-btn" type="button">登录</button>
          </div>
        </div>

        <!-- 管理面板（登录后显示） -->
        <div id="adminBox" class="hidden">
          <!-- 发布框 -->
          <div class="composer">
            <textarea id="feedText" placeholder="记录此刻…" maxlength="500"></textarea>
            <div class="composer-tools">
              <button id="btnAudio" class="tool-btn" type="button">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0"/><path d="M12 18v3"/></svg>
                语音
              </button>
              <input type="file" id="audioFile" accept="audio/*" hidden />
              <button id="btnImage" class="tool-btn" type="button">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg>
                图片
              </button>
              <input type="file" id="imageFile" accept="image/*" hidden />
              <button id="btnVideo" class="tool-btn" type="button">
                <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="13" height="12" rx="2"/><path d="M15 10l7-3v10l-7-3"/></svg>
                视频
              </button>
              <input type="file" id="videoFile" accept="video/*" hidden />
              <button id="btnLogout" class="tool-btn logout-btn" type="button">退出</button>
              <button id="btnPublish" class="publish-btn" type="button">发布</button>
            </div>
            <div id="composerPreview" class="composer-preview hidden"></div>
          </div>

          <!-- 已发布动态（带删除） -->
          <div id="adminFeedList" class="feed-list"></div>
        </div>

      </div>
    </main>
  </section>

  <script src="js/admin.js"></script>
</body>
</html>
