<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>in平度</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://webapi.amap.com/maps?v=2.0&key=6715e30900a0a37aa0dccd9b09c6cd2a"></script>
</head>
<body>

  <!-- ============ 视图一：首页（两扇门） ============ -->
  <section id="viewHome" class="view view-home">
    <div class="pixel-room">
      <!-- 像素门 -->
      <div class="pixel-doors">
        <button class="px-door" id="btnFood" type="button">
          <span class="px-frame"></span>
          <span class="px-panel"></span>
          <span class="px-knob"></span>
          <span class="px-label">美食</span>
        </button>
        <button class="px-door" id="btnStreet" type="button">
          <span class="px-frame"></span>
          <span class="px-panel"></span>
          <span class="px-knob"></span>
          <span class="px-label">扫街</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ============ 视图二：美食地图 ============ -->
  <section id="viewFood" class="view view-food hidden">
    <header class="site-header">
      <div class="header-inner">
        <button class="back-btn" id="backHomeTop" type="button">‹ 返回房间</button>
        <h1 class="site-title">美食地图</h1>
        <p class="site-sub">in平度 · 本地人私藏的美味地图</p>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索店名 / 类别 / 地址…" />
        </div>
        <div class="filter-box">
          <span class="filter-label">筛选：</span>
          <div id="categoryTags" class="tag-list"></div>
        </div>
      </section>

      <div class="content">
        <section class="map-panel">
          <div id="map" class="map"></div>
        </section>

        <section class="list-panel">
          <div class="list-head">
            <span id="countLabel">共 0 家店铺</span>
          </div>
          <ul id="foodList" class="food-list"></ul>
        </section>
      </div>
    </main>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="modal hidden">
      <div class="modal-mask"></div>
      <div class="modal-box">
        <button class="modal-close" id="modalClose">&times;</button>
        <h2 id="detailName"></h2>
        <div class="detail-meta">
          <span class="detail-category" id="detailCategory"></span>
          <span class="detail-address" id="detailAddress"></span>
        </div>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="detail-actions">
          <a id="detailMapLink" href="#" target="_blank" class="btn-map">在地图中打开</a>
        </div>
      </div>
    </div>
  </section>

  <!-- ============ 视图三：扫街 ============ -->
  <section id="viewStreet" class="view view-street hidden">
    <header class="site-header">
      <div class="header-inner">
        <button class="back-btn" id="backHomeBottom" type="button">‹ 返回房间</button>
        <p class="site-sub">in平度 · 平度扫街正在筹备中</p>
      </div>
    </header>

    <main class="container">
      <div class="street-gallery">
        <div class="street-empty">
          <span class="street-empty-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="7" width="18" height="13" rx="2.5"/>
              <circle cx="12" cy="13.5" r="3.5"/>
              <path d="M8.5 7l1.2-2h4.6l1.2 2"/>
            </svg>
          </span>
          <h2>扫街频道 · 筹备中</h2>
          <span class="street-tag">平度 · 街头 · 生活</span>
        </div>
      </div>
    </main>
  </section>

  <footer class="site-footer">
    <p>数据持续更新中 · in平度</p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
