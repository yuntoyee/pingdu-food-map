<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>in平度</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://webapi.amap.com/maps?v=2.0&key=6715e30900a0a37aa0dccd9b09c6cd2a"></script>
</head>
<body>

  <!-- ============ 美食地图 ============ -->
  <section id="viewFood" class="view view-food">
    <header class="site-header">
      <div class="header-inner">
        <h1 class="site-title">美食地图</h1>
        <p class="site-sub">in平度 · 本地人私藏的美味地图</p>
      </div>
    </header>

    <main class="container">
      <section class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索店名 / 类别 / 地址…" />
        </div>
        <div class="filter-box">
          <span class="filter-label">筛选：</span>
          <div id="categoryTags" class="tag-list"></div>
        </div>
      </section>

      <div class="content">
        <section class="map-panel">
          <div id="map" class="map"></div>
        </section>

        <section class="list-panel">
          <div class="list-head">
            <span id="countLabel">共 0 家店铺</span>
          </div>
          <ul id="foodList" class="food-list"></ul>
        </section>
      </div>
    </main>

    <!-- 详情弹窗 -->
    <div id="detailModal" class="modal hidden">
      <div class="modal-mask"></div>
      <div class="modal-box">
        <button class="modal-close" id="modalClose">&times;</button>
        <h2 id="detailName"></h2>
        <div class="detail-meta">
          <span class="detail-category" id="detailCategory"></span>
          <span class="detail-address" id="detailAddress"></span>
        </div>
        <p class="detail-desc" id="detailDesc"></p>
        <div class="detail-actions">
          <a id="detailMapLink" href="#" target="_blank" class="btn-map">在地图中打开</a>
        </div>
      </div>
    </div>
  </section>

  <footer class="site-footer">
    <p>数据持续更新中 · in平度</p>
    <p class="footer-beian">
      <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener noreferrer">鲁ICP备2026017661号-2</a>
    </p>
  </footer>

  <script src="js/app.js"></script>
</body>
</html>
